# Optional: Render "Blueprint" (New -> Blueprint). Env values Render dashboard mein bharna.
services:
  - type: web
    name: webhost-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: BOT_TOKEN
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: BASE_URL
        sync: false
      - key: EXTRA_DOMAINS
        sync: false
      - key: DEV_NAME
        value: Developer
      - key: DEV_USERNAME
        sync: false
